name: exam

services:
  kb-service:
    build: ./kb-service
    image: exam/kb-service:latest
    container_name: kb-service
    restart: unless-stopped
    ports:
      - "${KB_PORT:-8090}:8090"
    environment:
      KB_DATA: /data
    volumes:
      - ./data/kb:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  ocr-service:
    build: ./ocr-service
    image: exam/ocr-service:latest
    container_name: ocr-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OCR_PORT:-8093}:8090"   # 只给本机用，容器间走内部网络
    env_file:
      - .env
    environment:
      # 与 solver 共用模型配置：网页「模型配置」里 role=ocr 的条目由此生效
      SHARED_MODELS: /shared/llm_models.json
    volumes:
      - ./data/solver:/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  exam-solver:
    build: ./exam-solver
    image: exam/exam-solver:latest
    container_name: exam-solver
    restart: unless-stopped
    depends_on:
      - ocr-service
      - kb-service
    ports:
      - "${SOLVER_PORT:-8092}:8092"
    env_file:
      - .env
    environment:
      # 容器间走内部网络，固定写死；宿主机端口用上面的变量调
      OCR_URL: http://ocr-service:8090/ocr
      KB_SERVICE: http://kb-service:8090
      KB_DATA: /app/data
    volumes:
      - ./data/solver:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
